<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gym Timzone</title>

  <!-- Mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Luxon -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      padding: 10px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 20px;
      width: 95%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 { font-size: 28px; margin-bottom: 10px; font-weight: 700; }

    label {
      font-size: 13px;
      opacity: 0.8;
      display: block;
      margin-bottom: 6px;
      text-align: left;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.15);
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      margin-top: 6px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,114,255,0.4);
    }

    .results { margin-top: 25px; text-align: left; }

    .time-box {
      background: rgba(255,255,255,0.12);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }

    .zone { opacity: 0.7; font-size: 13px; }
    .time { font-size: 16px; font-weight: 600; }

    @media (max-width: 480px) {
      .card { padding: 30px 20px; border-radius: 16px; }
      h1 { font-size: 24px; }
      .time { font-size: 18px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>💪 Gym Timezone</h1>

    <label>Select Time</label>
    <input type="time" id="timeInput">

    <label>Select Timezone</label>
    <select id="timezoneSelect">
      <option value="Asia/Kolkata">🇮🇳 IST</option>
      <option value="America/New_York">🇺🇸 ET</option>
      <option value="UTC">🇬🇧 GMT</option>
    </select>

    <button onclick="convertTime()">Convert Time</button>

    <!-- NEW: Share button -->
    <button id="shareBtn" style="display:none;">Share this time</button>

    <div class="results" id="output"></div>
  </div>

<script>
const { DateTime } = luxon;

let lastShareText = "";

function convertTime() {
  const timeValue = document.getElementById("timeInput").value;
  const selectedZone = document.getElementById("timezoneSelect").value;

  if (!timeValue) {
    alert("Select a time first 💪");
    return;
  }

  const [hour, minute] = timeValue.split(":");

  const baseTime = DateTime.now()
    .setZone(selectedZone)
    .set({ hour: parseInt(hour), minute: parseInt(minute), second: 0, millisecond: 0 });

  const ist = baseTime.setZone("Asia/Kolkata").toFormat("h:mma").toLowerCase();
  const nyc = baseTime.setZone("America/New_York").toFormat("h:mma").toLowerCase();
  const utc = baseTime.setZone("UTC").toFormat("h:mma").toLowerCase();

  document.getElementById("output").innerHTML = `
    <div class="time-box">
      <div><div class="zone">🇮🇳 IST</div></div>
      <div class="time">${baseTime.setZone("Asia/Kolkata").toFormat("hh:mm a")}</div>
    </div>

    <div class="time-box">
      <div><div class="zone">🇺🇸 ET</div></div>
      <div class="time">${baseTime.setZone("America/New_York").toFormat("hh:mm a")}</div>
    </div>

    <div class="time-box">
      <div><div class="zone">🇬🇧 GMT</div></div>
      <div class="time">${baseTime.setZone("UTC").toFormat("hh:mm a")}</div>
    </div>
  `;

  // NEW: build share text + enable button
  lastShareText = `I'll be at the gym at ${ist} India  / ${nyc} US / ${utc} UK`;

  const shareBtn = document.getElementById("shareBtn");
  shareBtn.style.display = "block";
  shareBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(lastShareText);
      shareBtn.textContent = "Copied ✅";
      setTimeout(() => (shareBtn.textContent = "Share this time"), 1200);
    } catch (e) {
      alert("Couldn’t copy to clipboard (browser blocked it).");
    }
  };
}
</script>

</body>
</html>
